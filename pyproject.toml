[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "evidence-desk"
version = "0.2.0"
description = "Source-grounded research briefs with SQLite retrieval and optional LLM generation"
requires-python = ">=3.11"
dependencies = ["fastapi==0.115.6", "uvicorn==0.34.0", "httpx==0.28.1", "pydantic==2.10.4", "pypdf==7.0.1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.setuptools.package-data]
evidence_desk = ["static/*", "data/*.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
